services:

  backend:
    build:
      context: ./server
    container_name: jrgr-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: jrgr-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped